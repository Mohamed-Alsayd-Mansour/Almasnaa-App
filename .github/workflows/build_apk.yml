name: Build Flutter APK

on:
  push:
    branches:
      - main # أو master
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب كود المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ضبط إعدادات Java (الإصدار 17)
      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد بيئة عمل Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. جلب مكتبات مشروع Flutter
      - name: Install dependencies
        run: flutter pub get

      # 5. تحديث رابط Gradle مباشرة في ملف gradle-wrapper.properties
      - name: Update Gradle Version
        run: |
          sed -i 's/gradle-.*-bin.zip/gradle-8.14-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties

      # 6. بناء ملف الـ APK
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 7. رفع الـ APK المبنيلتحميله من GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
